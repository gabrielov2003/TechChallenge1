version: '3.8'

services:
  api-oficina:
    build: .
    container_name: oficina_backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/instance
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///data/oficina.db
      - JWT_SECRET_KEY="lets-rock-the-future-123"